name: 问题报告
description: 报告可复现的安装、录制或上传问题
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: "请勿提交凭据、完整运行配置、私人录像或未脱敏日志。安全漏洞请按 SECURITY.md 建立私人报告渠道。"
  - type: input
    id: version
    attributes:
      label: 程序版本
      description: 查看项目根目录 VERSION 文件
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 系统与环境
      description: Windows 版本、Python 版本、Chrome 版本及本机或远程模式
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期结果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际结果与脱敏错误信息
    validations:
      required: true
