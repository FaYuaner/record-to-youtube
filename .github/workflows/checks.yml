name: Offline checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r server/requirements.txt
      - run: python -B tests/run_offline.py
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check desktop configuration
        shell: powershell
        run: powershell -NoProfile -File tests/desktop_settings_tests.ps1
